[templates.neovim]
input_path = "~/.config/noctalia/templates/nvim.lua"
output_path = "~/.config/nvim/lua/noctalia_colors.lua"
# This signal tells Neovim to refresh without restarting
post_hook = "pkill -USR1 nvim"
