# Niri/OmniWM-inspired Paneru configuration.
# Option is the primary window-manager modifier on macOS.

[options]
focus_follows_mouse = false
mouse_follows_focus = true
auto_center = false
animation_speed = 20.0
# The macOS menu bar auto-hides, so do not reserve its detected height.
menubar_height = 32
preset_column_widths = [0.33333, 0.5, 0.66667, 1.0]
window_resize_cycle = true
# mouse_resize_modifier = "alt"
# Paneru 0.4.4 immediately reaps a newly selected empty numbered workspace,
# which flashes the target number but leaves the previous row visible.
reap_empty_workspaces = false
virtual_workspace_animations = false
insert_windows_mid_strip = true
create_virtual_workspace_automatically = true

# Reserve SketchyBar plus a 2 px outer gap on every screen edge.
[padding]
top = 2
bottom = 2
left = 2
right = 2

[windows.ghostty_quick]
title = "^~$"
bundle_id = "com.mitchellh.ghostty"
floating = true

# Keep the strip bounded at its first and last windows.
[swipe]
continuous = false

# Match OmniWM's Option+scroll behavior. Add Shift to change workspace rows.
[swipe.scroll]
modifier = "alt"
vertical_modifier = "shift"

[decorations]
workspace_menu_status = true
workspace_popup_status = true

# Port OmniWM's thin green focused-window border.
[decorations.active.border]
enabled = true
color = "#00ff00"
opacity = 1.0
width = 1.0
radius = "auto"

[bindings]
# Focus windows using the same directional layout as Niri.
window_focus_west = "alt - h"
window_focus_south = "alt - j"
window_focus_north = "alt - k"
window_focus_east = "alt - l"
window_focus_first = "alt - home"
window_focus_last = "alt - end"

# Move windows/columns. Paneru calls this operation swapping.
window_swap_west = "ctrl + alt - h"
window_swap_south = "ctrl + alt - j"
window_swap_north = "ctrl + alt - k"
window_swap_east = "ctrl + alt - l"
window_swap_first = "ctrl + alt - home"
window_swap_last = "ctrl + alt - end"

# Column and window layout.
window_resize = "alt - r"
window_shrink = "alt + shift - r"
window_center = "alt - c"
window_snap = "alt + shift - c"
window_fullwidth = ["alt - m", "alt - f"]
window_manage = "alt - space"
window_stack = "alt - leftbracket"
window_unstack = "alt - rightbracket"
window_equalize = "ctrl + alt - b"
window_balance = "alt + shift - b"

# Paneru only exposes next-display movement rather than directional monitors.
window_nextdisplay = "ctrl + cmd - tab"

# Switch virtual workspaces like Niri's vertical workspace stack.
window_virtual_south = "alt - u"
window_virtual_north = "alt - i"
window_virtualmove_south = "ctrl + alt - u"
window_virtualmove_north = "ctrl + alt - i"

# Direct workspace switching. Zero represents workspace 10, as in Niri.
window_virtualnum_1 = "alt - 1"
window_virtualnum_2 = "alt - 2"
window_virtualnum_3 = "alt - 3"
window_virtualnum_4 = "alt - 4"
window_virtualnum_5 = "alt - 5"
window_virtualnum_6 = "alt - 6"
window_virtualnum_7 = "alt - 7"
window_virtualnum_8 = "alt - 8"
window_virtualnum_9 = "alt - 9"
window_virtualnum_10 = "alt - 0"

# Move the focused window to a workspace and follow it.
window_virtualmovenum_1 = "alt + shift - 1"
window_virtualmovenum_2 = "alt + shift - 2"
window_virtualmovenum_3 = "alt + shift - 3"
window_virtualmovenum_4 = "alt + shift - 4"
window_virtualmovenum_5 = "alt + shift - 5"
window_virtualmovenum_6 = "alt + shift - 6"
window_virtualmovenum_7 = "alt + shift - 7"
window_virtualmovenum_8 = "alt + shift - 8"
window_virtualmovenum_9 = "alt + shift - 9"
window_virtualmovenum_10 = "alt + shift - 0"
